name: AyakaMods badges

# Reads the AyakaMods page and keeps the README's download / view badges current.
# The numbers live on the "badges" branch so main only has real commits.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ayakamods-badges
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read AyakaMods
        run: python tools/ayakamods_stats.py out
      - name: Publish to the badges branch
        run: |
          if [ ! -f out/ayakamods.json ]; then echo "nothing new; badges unchanged"; exit 0; fi
          cd out
          git init -q -b badges
          git config user.name "Hung1510"
          git config user.email "giahung1510200519@gmail.com"
          git add -A
          git commit -qm "AyakaMods stats"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
