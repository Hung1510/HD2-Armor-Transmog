name: release

# Push a tag like v4.1 and this builds the presets zip and attaches it to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install lupa
      - run: python tools/picker.py export-web --check
      - run: |
          python tests/test_ingame.py
          node tests/test_web_parity.js
      - run: python tools/picker.py release --zip dist/Passive-Picker-v4.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Passive-Picker-v4.zip
          generate_release_notes: true
