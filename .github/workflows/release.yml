name: release

# Push a tag like v5.4: runs every test, builds both editions and publishes the release
# with its notes taken from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install lupa pillow unicorn keystone-engine
      - run: python tools/picker.py export-web --check
      - run: python tests/run_all.py
      - run: python tools/picker.py release --zip dist/Super-Earth-Armory-Forge.zip
      - run: python tools/picker.py release --edition swap --zip dist/Super-Earth-Armory-Forge-Passive-Swap.zip
      - run: python tools/release_notes.py "${{ github.ref_name }}" > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/Super-Earth-Armory-Forge.zip
            dist/Super-Earth-Armory-Forge-Passive-Swap.zip
