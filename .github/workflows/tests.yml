name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Python lint (ruff, settings in pyproject.toml)
        run: ruff check tools tests
      - name: Lua compiles (engine + panel, both editions)
        run: |
          pip install lupa
          python tools/picker.py release --zip /tmp/full.zip
          python tools/picker.py release --edition swap --zip /tmp/swap.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install lupa pillow unicorn keystone-engine

      - name: Web builder data is in sync with tools/
        run: python tools/picker.py export-web --check

      - name: Every loadout builds
        run: |
          for f in presets/*.ini examples/*.ini loadout.ini; do
            echo "== $f"; python tools/picker.py build "$f" > /dev/null
          done

      - name: Engine + in-game panel against a fake game (LuaJIT)
        run: python tests/test_ingame.py

      - name: Panel presets, quick-swap, undo, share codes, units
        run: python tests/test_panel_features.py

      - name: Panel layout (no overlapping or clipped text)
        run: python tests/test_panel_layout.py

      - name: Panel size and whole-pixel drawing
        run: python tests/test_panel_scale.py

      - name: Scrolling lists and dragging the panel
        run: python tests/test_panel_scroll_drag.py

      - name: Keys tab, bad-key fallback, passive search
        run: python tests/test_panel_keys_search.py

      - name: Passive info, stack summary, Remove armor
        run: python tests/test_passive_info.py

      - name: Controller (fake XInput pad)
        run: python tests/test_controller.py

      - name: Passive Swap edition (Nexus build)
        run: python tests/test_swap_edition.py

      - name: Release zip, blank install, old saves
        run: python tests/test_release.py

      - name: Web builder produces identical bytes to Python
        run: node tests/test_web_parity.js

      - name: Summary of every suite
        run: python tests/run_all.py
