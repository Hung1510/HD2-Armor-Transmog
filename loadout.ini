; ================================================================
; Passive Picker v4 loadout  (the shipped default - edit and rebuild)
; Build:  python tools/picker.py build loadout.ini --zip "My Stack.zip"
; List every effect + default:  python tools/picker.py list
; ================================================================

[settings]
name   = Passive Picker v4      ; name shown in the mod manager
retire = true                   ; true: patch once. false: re-check every 5s

; One [profile: <passive>] per armour passive you want to boost.
; Wear armour that HAS that passive and it gets everything set 'on'.
; Add more sections (e.g. [profile: Siege-Ready]) for different stacks.
[profile: Med-Kit]
conflicts = stack   ; stack: shared effects all apply | strongest: keep the biggest one

; ---- passives to add ----
Extra Padding                      = on
Scout                              = off
Fortified                          = on
Electrical Conduit                 = on
Engineering Kit                    = on
Servo-Assisted                     = on
Democracy Protects                 = on
Reinforced Epaulettes              = off
Inflammable                        = on
Peak Physique                      = off
Advanced Filtration                = on
Unflinching                        = on
Acclimated                         = off
Siege-Ready                        = on
Integrated Explosives              = off
Gunslinger                         = on
Adreno-Defibrillator               = off
Ballistic Padding                  = on
Desert Stormer                     = off
Feet First                         = off
Reduced Signature                  = on
Rock-Solid                         = on
Supplemental Adrenaline            = on
Concussive Padding, Reinforced     = on
Concussive Padding, Grenadier      = on
Concussive Padding, Hazmat         = on
Oxygenator                         = on
Kinetic Displacement Mitigation    = on
Blunt-Force Mitigation             = on
True Grit                          = on

; ---- value tweaks:  <Passive>.<effect> = number ----
; Tweaking the trigger passive (Med-Kit here) REPLACES its own value.
; Tweaking any other passive changes the value it adds.
Med-Kit.stims                    = 6
Democracy Protects.death_save    = 2.0

; ---- advanced: raw rows  (hex_id type value, comma separated) ----
; type 0 set, 1 add, 2 multiply, 3 time
;raw       = 0xAFAE3B47 1 2.0
;raw_stats = 13 0.0 1.5
